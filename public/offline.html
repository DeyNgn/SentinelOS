<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05080b">
    <title>Section OS · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #05080b; color: #e8f4f5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 38%, #0c2633 0%, #05080b 62%); }
      main { width: min(100%, 440px); border-left: 2px solid #63dff5; padding: 8px 0 8px 20px; }
      p { margin: 0; color: #99adb5; font-size: 13px; line-height: 1.7; }
      h1 { margin: 10px 0; font-size: 20px; letter-spacing: 0; }
      button { margin-top: 20px; border: 1px solid #49606b; background: #0c151a; color: #e8f4f5; padding: 10px 14px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>SECTION OS // OFFLINE</p>
      <h1>Operator connection paused</h1>
      <p>Your local app shell is installed. Reconnect to reach live conversations, operations, and system data.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
